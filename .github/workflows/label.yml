# This workflow will triage pull requests and apply a label based on the
# paths that are modified in the pull request, plus a few keywords in the title.
#
# For more information, see: https://github.com/actions/labeler/blob/master/README.md

name: Labeler
on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@v7
        with:
          repo-token: '${{ secrets.GITHUB_TOKEN }}'
      - name: Label by title
        uses: actions/github-script@v9
        with:
          script: |
            const title = context.payload.pull_request.title;
            const labels = [];
            const amdRga = /\bamd rga\b/i.test(title);
            if (amdRga || /\b(win(dows|32|64)?|msvc|mingw)\b/i.test(title)) labels.push('MS/Windows');
            if (/\b(msvc|clang-cl)\b/i.test(title)) labels.push('msvc');
            if (!amdRga && /\b(gpus?|cuda|nvcc|ptx|amdgpu|rocm|hip|rga|opencl|spir-?v|vulkan|glsl|hlsl|slang|triton|tilelang|cute ?dsl|shaders?|device view(er)?)\b/i.test(title)) labels.push('gpu');
            if (labels.length === 0) return;
            await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.payload.pull_request.number,
                labels,
            });
