# The Compiler Explorer infra package should install duckc on PATH.
compilers=duckc:duckcdvm
defaultCompiler=duckc
compilerType=duckling
versionFlag=--version
supportsBinary=false
supportsBinaryObject=false
supportsExecute=false

compiler.duckc.name=Duckling
compiler.duckc.exe=duckc
compiler.duckc.compilerType=duckling
compiler.duckc.supportsExecute=true
compiler.duckc.supportsBinary=true

compiler.duckcdvm.name=Duckling (DVM)
compiler.duckcdvm.exe=duckc
compiler.duckcdvm.compilerType=duckling-dbc
compiler.duckcdvm.dvmExe=VM
compiler.duckcdvm.supportsExecute=true
compiler.duckcdvm.supportsBinary=true
