compilers=&mach
defaultCompiler=mach540
compilerType=mach
objdumper=/opt/compiler-explorer/gcc-16.2.0/bin/objdump
llvmObjdumper=/opt/compiler-explorer/clang-trunk/bin/llvm-objdump
supportsBinary=true
supportsBinaryObject=true
supportsExecute=true
supportsLibraryCodeFilter=true
binaryHideFuncRe=^(std\..*|_start|_rt_.*|_std_.*|.*@plt.*)$

group.mach.compilers=mach540:mach531:mach521:mach510:mach504
group.mach.isSemVer=true
group.mach.baseName=mach
group.mach.versionFlag=info|--version
group.mach.licenseLink=https://github.com/briar-systems/mach/blob/main/LICENSE
group.mach.licenseName=MIT License

# the newest release, and the latest patch of every older 5.x minor. Each install carries the std release it pairs
# with in <install>/std, see docs/Mach.md
compiler.mach540.exe=/opt/compiler-explorer/mach-5.4.0/mach
compiler.mach540.semver=5.4.0
compiler.mach531.exe=/opt/compiler-explorer/mach-5.3.1/mach
compiler.mach531.semver=5.3.1
compiler.mach521.exe=/opt/compiler-explorer/mach-5.2.1/mach
compiler.mach521.semver=5.2.1
compiler.mach510.exe=/opt/compiler-explorer/mach-5.1.0/mach
compiler.mach510.semver=5.1.0
compiler.mach504.exe=/opt/compiler-explorer/mach-5.0.4/mach
compiler.mach504.semver=5.0.4
