compilers=&mach
defaultCompiler=mach520
compilerType=mach
objdumper=/opt/compiler-explorer/gcc-16.2.0/bin/objdump
llvmObjdumper=/opt/compiler-explorer/clang-trunk/bin/llvm-objdump
supportsBinary=true
supportsBinaryObject=true
supportsExecute=true
supportsLibraryCodeFilter=true
binaryHideFuncRe=^(std\..*|_start|_rt_.*|_std_.*|.*@plt.*)$

group.mach.compilers=mach520
group.mach.isSemVer=true
group.mach.baseName=mach
group.mach.versionFlag=info|--version
group.mach.licenseLink=https://github.com/briar-systems/mach/blob/main/LICENSE
group.mach.licenseName=MIT License

# each install carries the std release it was released with in <install>/std, see docs/Mach.md
compiler.mach520.exe=/opt/compiler-explorer/mach-5.2.0/mach
compiler.mach520.semver=5.2.0
