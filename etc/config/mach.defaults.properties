compilers=&mach
defaultCompiler=mach
compilerType=mach
objdumper=objdump
llvmObjdumper=llvm-objdump
supportsBinary=true
supportsBinaryObject=true
supportsExecute=true
supportsLibraryCodeFilter=true
binaryHideFuncRe=^(std\..*|_start|.*@plt.*)$

group.mach.compilers=mach
group.mach.isSemVer=true
group.mach.baseName=mach
group.mach.versionFlag=info|--version

# mach installs no std of its own: every compiler needs the std release it was released with. By default that is
# <dir of exe>/std, so unpacking a release into /opt/mach and checking out its std into /opt/mach/std needs nothing
# more. Set compiler.mach.stdPath to use a std from anywhere else. See docs/Mach.md.
compiler.mach.exe=/opt/mach/mach
