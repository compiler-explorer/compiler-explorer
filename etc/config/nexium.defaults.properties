# Default settings for Nexium (https://londopy.github.io/nexium/)
#
# nx emits C and drives a C compiler (zig cc, or gcc/clang/cc on the PATH).
# Without the binary filter the output pane shows the emitted C; with it,
# `nx build` makes an executable that is disassembled as usual, which needs
# a C compiler nx can find (NX_CC names one).

objdumper=objdump
supportsBinary=true
supportsExecute=true
versionFlag=version
compilerType=nexium

compilers=nexium
defaultCompiler=nexium

compiler.nexium.exe=/usr/local/bin/nx
compiler.nexium.name=Nexium
